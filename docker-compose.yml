services:
  nighttime-ninja:
    image: ghcr.io/spacegoose02/nighttime-ninja:latest
    # To build from this folder instead of pulling: comment out "image" and uncomment "build".
    # build: .
    container_name: nighttime-ninja
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Fixed inside the container so a DATA_DIR or PORT in .env (meant for running without Docker) can't move the
      # database out of the volume or the server off the published port.
      DATA_DIR: /data
      PORT: "8080"
      # Your time zone, so reminders go out at 9 am and 5 pm your time.
      TZ: ${TZ:-UTC}
