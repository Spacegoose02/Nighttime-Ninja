name: Release apps

# Push a tag like v0.1.0 to build the Windows EXE and Android APK and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist --workspace apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/release/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - name: Create the Android project
        working-directory: web
        run: npx cap add android && npx cap sync android
      # Icons and splash screens are pre-generated into web/android-res from web/assets with:
      #   npx capacitor-assets generate --android --iconBackgroundColor "#2f7d4f" --splashBackgroundColor "#f3f7f2" --splashBackgroundColorDark "#0f1612"
      - name: Add the raccoon app icon and splash screen
        run: cp -r web/android-res/. web/android/app/src/main/res/
      - name: Build APK
        working-directory: web/android
        run: ./gradlew assembleDebug
      - run: mv web/android/app/build/outputs/apk/debug/app-debug.apk NighttimeNinja-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: NighttimeNinja-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
