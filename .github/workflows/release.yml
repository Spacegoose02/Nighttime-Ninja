name: Release apps

# Push a tag like v0.1.0 to build the Windows EXE and Android APK and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist --workspace apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          # latest.yml and the blockmap let the installed Windows app update itself.
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - name: Stamp the app version (the launcher uses it to offer updates)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "window.NN_APP_VERSION = '${GITHUB_REF_NAME#v}';" > apps/launcher/version.js
      - name: Create the Android project
        working-directory: web
        run: npx cap add android && npx cap sync android
      # Icons and splash screens are pre-generated into web/android-res from web/assets with:
      #   npx capacitor-assets generate --android --iconBackgroundColor "#2f7d4f" --splashBackgroundColor "#f3f7f2" --splashBackgroundColorDark "#0f1612"
      - name: Add the raccoon app icon and splash screen
        run: cp -r web/android-res/. web/android/app/src/main/res/
      # A signed release build needs four repository secrets (Settings > Secrets and variables > Actions):
      #   ANDROID_KEYSTORE_BASE64  the .jks file, base64-encoded (base64 -w0 release.jks)
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the workflow falls back to a debug build so releases keep working.
      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: web
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Capacitor signs with apksigner, which lives in the SDK build-tools rather than on the PATH.
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1):$PATH"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          npx cap build android --androidreleasetype APK \
            --keystorepath "$RUNNER_TEMP/release.jks" --keystorepass "$ANDROID_KEYSTORE_PASSWORD" \
            --keystorealias "$ANDROID_KEY_ALIAS" --keystorealiaspass "$ANDROID_KEY_PASSWORD"
          rm "$RUNNER_TEMP/release.jks"
          mv android/app/build/outputs/apk/release/app-release-signed.apk "../NighttimeNinja-${GITHUB_REF_NAME}.apk"
      - name: Build debug APK (no signing key configured)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        working-directory: web/android
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this release ships a debug-signed APK."
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "../../NighttimeNinja-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: NighttimeNinja-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
