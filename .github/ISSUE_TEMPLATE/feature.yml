name: Feature idea
description: Suggest something new or better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to get done in your kitchen, not just the button you'd add.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
  - type: textarea
    id: else
    attributes:
      label: Anything else? (optional)
      description: Other apps that do this well, screenshots, sketches.
